# Revision: 1. Native and production-browser regression gates.
name: Validate
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python pgms/run_tests.py --verbose
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e . et-xmlfile==2.0.0
      - run: .venv/bin/python pgms/run_tests.py
      - run: npm ci
        working-directory: web
      - run: .venv/bin/python pgms/prepare_browser.py
      - run: npm run typecheck && npm run lint && npm audit --omit=dev --audit-level=high && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm test
        working-directory: web
        env:
          CI: 'true'
          JPI_TEST_SERVER: npm run preview
